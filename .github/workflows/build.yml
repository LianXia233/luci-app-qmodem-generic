name: Build IPK & APK

# 手动触发：编译完成后把 IPK / APK 一并上传到 Release
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag（留空则自动使用 v<版本>-build<运行号>）'
        required: false
        default: ''
      publish_release:
        description: '编译成功后创建/更新 Release'
        type: boolean
        required: false
        default: true
      prerelease:
        description: '标记为预发布(pre-release)'
        type: boolean
        required: false
        default: false
      keep_releases:
        description: '发布后保留最近几个 Release（其余自动删除，含对应 tag）'
        required: false
        default: '1'

# 加入并发控制：相同 workflow 多次触发时自动取消旧任务
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PKG_DIR: luci-app-qmodem-generic

jobs:
  # ---------------------------------------------------------------- 静态检查
  lint:
    name: Static check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JS syntax check
        run: |
          # 使用 xargs 提高效率，且完美处理特殊文件名
          find "$PKG_DIR/htdocs" -name '*.js' -print0 | xargs -0 -r -n1 node --check

      - name: JSON syntax check
        run: |
          find "$PKG_DIR/root" -name '*.json' -print0 | xargs -0 -r -n1 python3 -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8'))"

      - name: PO sanity check
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gettext
          find "$PKG_DIR/po" -name '*.po' -print0 | xargs -0 -r -n1 msgfmt --check-format --output-file=/dev/null

      - name: ACL / menu consistency
        run: |
          set -e
          acl="$PKG_DIR/root/usr/share/rpcd/acl.d/luci-app-qmodem-generic.json"
          menu="$PKG_DIR/root/usr/share/luci/menu.d/luci-app-qmodem-generic.json"
          key=$(python3 -c "import json,sys; print(list(json.load(open(sys.argv[1], encoding='utf-8')))[0])" "$acl")
          echo "ACL group: $key"
          grep -q "\"$key\"" "$menu"
          echo "menu.d 的 depends.acl 与 acl.d 一致"

  # ---------------------------------------------------------------- 编译矩阵
  build:
    name: ${{ matrix.tag }}
    needs: lint
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ImmortalWrt 23.05 / 24.10 使用 opkg → 产物为 .ipk
          - tag: immortalwrt-23.05-ipk
            sdk_dir: https://downloads.immortalwrt.org/releases/23.05.7/targets/x86/64
            optional: false
          - tag: immortalwrt-24.10-ipk
            sdk_dir: https://downloads.immortalwrt.org/releases/24.10.6/targets/x86/64
            optional: false
          # ImmortalWrt 25.12 / snapshots 使用 apk → 产物为 .apk
          - tag: immortalwrt-25.12-apk
            sdk_dir: https://downloads.immortalwrt.org/releases/25.12.1/targets/x86/64
            optional: false
          - tag: immortalwrt-snapshot-apk
            sdk_dir: https://downloads.immortalwrt.org/snapshots/targets/x86/64
            optional: true

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential flex bison g++ gawk gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget curl zstd xz-utils

      # 分解 SDK 解析、缓存和下载步骤，利用 GitHub Cache 大幅加速重复构建
      - name: Resolve SDK Info
        id: sdk-info
        run: |
          mkdir -p "$GITHUB_WORKSPACE/sdk"
          curl -fsSL "${{ matrix.sdk_dir }}/sha256sums" -o sha256sums
          SDK_FILE=$(grep -oE 'immortalwrt-sdk-[^ ]*\.tar\.(zst|xz)' sha256sums | head -n1)
          if [ -z "$SDK_FILE" ]; then
            echo "::error::未能在 ${{ matrix.sdk_dir }}/sha256sums 中找到 SDK"
            exit 1
          fi
          SDK_HASH=$(grep " \*\?$SDK_FILE\$" sha256sums | awk '{print $1}')
          echo "file=$SDK_FILE" >> $GITHUB_OUTPUT
          echo "hash=$SDK_HASH" >> $GITHUB_OUTPUT

      - name: Cache SDK Archive
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: ${{ steps.sdk-info.outputs.file }}
          key: sdk-archive-${{ matrix.tag }}-${{ steps.sdk-info.outputs.hash }}

      - name: Download & Verify SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          curl -fSL --retry 3 "${{ matrix.sdk_dir }}/${{ steps.sdk-info.outputs.file }}" -o "${{ steps.sdk-info.outputs.file }}"
          grep " \*\?${{ steps.sdk-info.outputs.file }}\$" sha256sums | sha256sum -c -

      - name: Extract SDK
        run: |
          FILE="${{ steps.sdk-info.outputs.file }}"
          echo "Extracting $FILE ..."
          case "$FILE" in
            *.tar.zst) tar -I zstd -xf "$FILE" --strip-components=1 -C "$GITHUB_WORKSPACE/sdk" ;;
            *.tar.xz)  tar -xJf  "$FILE" --strip-components=1 -C "$GITHUB_WORKSPACE/sdk" ;;
          esac

      - name: Prepare feeds
        working-directory: sdk
        run: |
          set -e
          # QModem 提供本包的运行时依赖 qmodem，加入 feed 后依赖才能被正确解析
          echo 'src-git qmodem https://github.com/FUjr/QModem.git' >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a -p luci
          ./scripts/feeds install qmodem \
            || echo "::warning::qmodem 未能从 feed 安装，依赖仅写入控制信息，不影响本包编译"

      - name: Copy package into SDK
        run: |
          cp -r "$GITHUB_WORKSPACE/$PKG_DIR" "$GITHUB_WORKSPACE/sdk/package/$PKG_DIR"

      - name: Configure
        working-directory: sdk
        run: |
          echo "CONFIG_PACKAGE_${PKG_DIR}=m" > .config
          make defconfig
          echo "--- 相关配置 ---"
          grep -E "^(CONFIG_PACKAGE_${PKG_DIR}|CONFIG_USE_APK)" .config || true

      - name: Compile
        working-directory: sdk
        run: |
          make "package/${PKG_DIR}/compile" -j"$(nproc)" V=s

      - name: Collect artifacts
        run: |
          out="$GITHUB_WORKSPACE/output"
          mkdir -p "$out"
          found=0
          while IFS= read -r f; do
            cp "$f" "$out/${{ matrix.tag }}__$(basename "$f")"
            found=$((found+1))
          done < <(find "$GITHUB_WORKSPACE/sdk/bin" -type f \( -name '*qmodem-generic*.ipk' -o -name '*qmodem-generic*.apk' \))
          
          echo "共产出 $found 个包"
          ls -lh "$out"
          if [ "$found" -eq 0 ]; then
            echo "::error::未找到任何 ipk/apk 产物"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.tag }}
          path: output/*
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------- 发布
  release:
    name: Publish release
    needs: build
    if: ${{ inputs.publish_release }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: packages-*
          merge-multiple: true

      - name: Resolve tag & notes
        id: meta
        run: |
          set -e
          # 增强版提取正则：防止 Makefile 中出现 `PKG_VERSION := 1.0.0` 带有空格导致提取失败
          VER=$(awk -F':=' '/^PKG_VERSION/ {gsub(/[[:space:]]/, "", $2); print $2}' "$PKG_DIR/Makefile")
          REL=$(awk -F':=' '/^PKG_RELEASE/ {gsub(/[[:space:]]/, "", $2); print $2}' "$PKG_DIR/Makefile")
          TAG="${{ inputs.release_tag }}"

          # tag 与显示名称分离：
          #   tag  保持机器可读，正式版用固定 tag（v2.4.11-r13），重复构建时原地
          #        更新而不是每次新建，从源头上避免 Release 历史堆积；预发布才带
          #        运行号以便区分。
          #   name 用人类可读格式，不再直接把裸 tag 当标题显示。
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            NAME="luci-app-qmodem-generic v${VER}-r${REL} Nightly (build ${{ github.run_number }})"
            if [ -z "$TAG" ]; then
              TAG="v${VER}-r${REL}-nightly.${{ github.run_number }}"
            fi
          else
            NAME="luci-app-qmodem-generic v${VER}-r${REL}"
            if [ -z "$TAG" ]; then
              TAG="v${VER}-r${REL}"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

          {
            echo "## luci-app-qmodem-generic ${VER}-${REL}"
            echo
            if [ "${{ inputs.prerelease }}" = "true" ]; then
              echo '> **预发布版本（Nightly）**：仅供测试，生产环境请使用正式版。'
            else
              echo '> **正式版（Stable）**'
            fi
            echo
            echo "QModem 通用美化版 LuCI Web UI，适用于任意被 QModem 识别的模组。"
            echo
            echo "### 安装"
            echo '```sh'
            echo '# opkg（ImmortalWrt 23.05 / 24.10）'
            echo 'opkg install luci-app-qmodem-generic_*.ipk'
            echo
            echo '# apk（ImmortalWrt 25.12 / snapshot）'
            echo 'apk add --allow-untrusted ./luci-app-qmodem-generic-*.apk'
            echo '```'
            echo
            echo '> 运行时依赖 `qmodem`，请先安装 QModem。'
            echo '> 若此前装过 `luci-app-mt5700m`，请先卸载再安装本包。'
            echo
            echo '### 产物'
            echo '| 文件 | 大小 |'
            echo '| --- | --- |'
            for f in dist/*; do
              [ -f "$f" ] || continue
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
            done
          } > release-notes.md

          # 追加更新日志：提取 CHANGELOG.md 第一个版本段落（到下一个 ## 标题为止）
          {
            echo
            echo '---'
            echo
            if [ -f CHANGELOG.md ]; then
              awk '/^## \[/{n++; if (n == 2) exit} n == 1' CHANGELOG.md
            else
              echo '_（未找到 CHANGELOG.md）_'
            fi
          } >> release-notes.md
          cat release-notes.md

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body_path: release-notes.md
          prerelease: ${{ inputs.prerelease }}
          files: dist/*
          fail_on_unmatched_files: true

      # 发布后清理历史 Release，避免长期累积。
      # releases 接口按创建时间倒序返回，跳过前 KEEP 个即可保留最新。
      - name: Clean up old releases
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          KEEP="${{ inputs.keep_releases }}"
          case "$KEEP" in
            ''|*[!0-9]*) echo "::warning::keep_releases 取值非法，跳过清理"; exit 0 ;;
          esac
          # 兜底：至少保留 1 个，避免误填 0 导致 Release 被清空
          if [ "$KEEP" -lt 1 ]; then
            echo "::warning::keep_releases < 1，已按 1 处理"
            KEEP=1
          fi
          echo "策略：保留最新 $KEEP 个 Release"

          mapfile -t IDS < <(gh api "repos/${{ github.repository }}/releases?per_page=100" --jq '.[].id')
          total=${#IDS[@]}
          echo "当前共 $total 个 Release"

          if [ "$total" -le "$KEEP" ]; then
            echo "数量未超过保留阈值，无需清理"
            exit 0
          fi

          for id in "${IDS[@]:$KEEP}"; do
            tag=$(gh api "repos/${{ github.repository }}/releases/$id" --jq '.tag_name')
            echo "删除 Release id=$id tag=$tag"
            gh api -X DELETE "repos/${{ github.repository }}/releases/$id" \
              || echo "::warning::删除 release $id 失败"
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$tag" \
              || echo "::warning::删除 tag $tag 失败"
          done
