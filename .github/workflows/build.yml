name: Build APK and IPK

# 手动触发：25.12 SDK 构建 APK，24.10 SDK 构建旧版 IPK；每种格式附带独立离线包。
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag（留空则自动使用 v<版本>-build<运行号>）'
        required: false
        default: ''
      prerelease:
        description: '标记为预发布(pre-release)'
        type: boolean
        required: false
        default: false
      keep_releases:
        description: '发布后保留最近几个 Release（其余自动删除，含对应 tag）'
        required: false
        default: '1'

# 加入并发控制：相同 workflow 多次触发时自动取消旧任务
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PKG_DIR: luci-app-qmodem-generic

jobs:
  # ---------------------------------------------------------------- 静态检查
  lint:
    name: Static check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JS syntax check
        run: |
          # 使用 xargs 提高效率，且完美处理特殊文件名
          find "$PKG_DIR/htdocs" -name '*.js' -print0 | xargs -0 -r -n1 node --check

      - name: Shell syntax check
        run: |
          find "$PKG_DIR/root" "$PKG_DIR/tests" -type f \( -name '*.sh' -o -name 'qmodem-support-custom' -o -name 'qmodem-modem-support' -o -name 'qmodem_support' -o -name 'qmodem_stats' \) -print0 | xargs -0 -r -n1 sh -n

      - name: JSON syntax check
        run: |
          find "$PKG_DIR/root" -name '*.json' -print0 | xargs -0 -r -n1 python3 -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8'))"

      - name: Offline installer checks
        run: |
          sh -n scripts/offline-install.sh.in
          python3 "$PKG_DIR/tests/test-offline-install.py"

      - name: Frontend compatibility checks
        run: node "$PKG_DIR/tests/run-frontend-tests.js"

      - name: PO sanity check
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gettext
          find "$PKG_DIR/po" -name '*.po' -print0 | xargs -0 -r -n1 msgfmt --check-format --output-file=/dev/null

      - name: ACL / menu consistency
        run: |
          set -e
          acl="$PKG_DIR/root/usr/share/rpcd/acl.d/luci-app-qmodem-generic.json"
          menu="$PKG_DIR/root/usr/share/luci/menu.d/luci-app-qmodem-generic.json"
          key=$(python3 -c "import json,sys; print(list(json.load(open(sys.argv[1], encoding='utf-8')))[0])" "$acl")
          echo "ACL group: $key"
          grep -q "\"$key\"" "$menu"
          echo "menu.d 的 depends.acl 与 acl.d 一致"

  # ---------------------------------------------------------------- APK / IPK 构建
  build:
    # 包内只有 LuCI 资源和脚本，LUCI_PKGARCH=all；x86 SDK 不限制安装设备架构
    name: Build ${{ matrix.format }} (ImmortalWrt ${{ matrix.version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: apk
            version: '25.12.1'
          - format: ipk
            version: '24.10.4'
    env:
      PACKAGE_FORMAT: ${{ matrix.format }}
      SDK_TAG: immortalwrt-${{ matrix.version }}-${{ matrix.format }}
      SDK_DIR: https://downloads.immortalwrt.org/releases/${{ matrix.version }}/targets/x86/64

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential flex bison g++ gawk gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget curl zstd xz-utils

      # 分解 SDK 解析、缓存和下载步骤，利用 GitHub Cache 大幅加速重复构建
      - name: Resolve SDK Info
        id: sdk-info
        run: |
          mkdir -p "$GITHUB_WORKSPACE/sdk"
          curl -fsSL "$SDK_DIR/sha256sums" -o sha256sums
          SDK_FILE=$(grep -oE 'immortalwrt-sdk-[^ ]*\.tar\.(zst|xz)' sha256sums | head -n1)
          if [ -z "$SDK_FILE" ]; then
            echo "::error::未能在 $SDK_DIR/sha256sums 中找到 SDK"
            exit 1
          fi
          SDK_HASH=$(grep " \*\?$SDK_FILE\$" sha256sums | awk '{print $1}')
          echo "file=$SDK_FILE" >> $GITHUB_OUTPUT
          echo "hash=$SDK_HASH" >> $GITHUB_OUTPUT

      - name: Cache SDK Archive
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: ${{ steps.sdk-info.outputs.file }}
          key: sdk-archive-${{ env.SDK_TAG }}-${{ steps.sdk-info.outputs.hash }}

      - name: Download & Verify SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          curl -fSL --retry 3 "$SDK_DIR/${{ steps.sdk-info.outputs.file }}" -o "${{ steps.sdk-info.outputs.file }}"
          grep " \*\?${{ steps.sdk-info.outputs.file }}\$" sha256sums | sha256sum -c -

      - name: Extract SDK
        run: |
          FILE="${{ steps.sdk-info.outputs.file }}"
          echo "Extracting $FILE ..."
          case "$FILE" in
            *.tar.zst) tar -I zstd -xf "$FILE" --strip-components=1 -C "$GITHUB_WORKSPACE/sdk" ;;
            *.tar.xz)  tar -xJf  "$FILE" --strip-components=1 -C "$GITHUB_WORKSPACE/sdk" ;;
          esac

      - name: Prepare feeds
        working-directory: sdk
        run: |
          set -e
          # QModem 提供本包的运行时依赖 qmodem，加入 feed 后依赖才能被正确解析
          echo 'src-git qmodem https://github.com/FUjr/QModem.git' >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a -p luci
          ./scripts/feeds install qmodem \
            || echo "::warning::qmodem 未能从 feed 安装，依赖仅写入控制信息，不影响本包编译"

      - name: Copy package into SDK
        run: |
          cp -r "$GITHUB_WORKSPACE/$PKG_DIR" "$GITHUB_WORKSPACE/sdk/package/$PKG_DIR"

      - name: Configure
        working-directory: sdk
        run: |
          printf '%s\n' "CONFIG_PACKAGE_${PKG_DIR}=m" 'CONFIG_LUCI_LANG_zh_Hans=y' > .config
          make defconfig
          echo "--- 相关配置 ---"
          grep -E "^(CONFIG_PACKAGE_${PKG_DIR}|CONFIG_USE_APK)" .config || true

      - name: Compile
        working-directory: sdk
        run: |
          # 本包只有资源和脚本：先生成翻译工具，再打包 UI。
          # 保留控制信息里的全部运行时依赖，避免把 QModem 后端及内核驱动一起重编。
          make package/luci-base/host/compile -j"$(nproc)" V=s
          make "package/${PKG_DIR}/compile" -j"$(nproc)" V=s NO_DEPS=1

      - name: Collect artifacts
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/output"
          mkdir -p "$out"
          found=0
          while IFS= read -r -d '' f; do
            cp "$f" "$out/$(basename "$f")"
            found=$((found+1))
          done < <(find "$GITHUB_WORKSPACE/sdk/bin" -type f -name "*qmodem-generic*.${PACKAGE_FORMAT}" -print0)

          echo "共产出 $found 个 $PACKAGE_FORMAT 包"
          ls -lh "$out"
          if [ -z "$(find "$out" -maxdepth 1 -type f -name "${PKG_DIR}*.${PACKAGE_FORMAT}" -print -quit)" ]; then
            echo "::error::未找到 ${PKG_DIR} 主包，不能只上传翻译包或空目录"
            exit 1
          fi

      - name: Build offline iStore installer
        run: |
          set -euo pipefail
          main_pkg=$(find output -maxdepth 1 -name "${PKG_DIR}*.${PACKAGE_FORMAT}" -print -quit)
          python3 scripts/build-offline-run.py "${main_pkg%.*}-${PACKAGE_FORMAT}-offline.run" output/*."$PACKAGE_FORMAT"

      - uses: actions/upload-artifact@v4
        id: packages
        with:
          name: qmodem-generic-${{ matrix.format }}
          path: |
            output/*.apk
            output/*.ipk
            output/*.run
          if-no-files-found: error
          retention-days: 30

      - name: Show package download
        env:
          ARTIFACT_URL: ${{ steps.packages.outputs.artifact-url }}
        run: |
          {
            echo "## $PACKAGE_FORMAT 已生成"
            echo
            echo "[下载本次安装包]($ARTIFACT_URL)（解压后优先安装 offline.run）"
            echo
            echo "[Releases 下载页]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases)（发布步骤成功后可直接下载）"
            echo
            echo '构建环境：ImmortalWrt ${{ matrix.version }} SDK；包架构：all。'
            echo
            echo '离线安装：将 offline.run 上传到 iStore 手动安装页，不访问软件源。'
            echo
            for f in output/*."$PACKAGE_FORMAT" output/*.run; do
              echo "- $(basename "$f")"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------- 发布
  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: qmodem-generic-*
          merge-multiple: true

      - name: Resolve tag & notes
        id: meta
        run: |
          set -e
          # 增强版提取正则：防止 Makefile 中出现 `PKG_VERSION := 1.0.0` 带有空格导致提取失败
          VER=$(awk -F':=' '/^PKG_VERSION/ {gsub(/[[:space:]]/, "", $2); print $2}' "$PKG_DIR/Makefile")
          REL=$(awk -F':=' '/^PKG_RELEASE/ {gsub(/[[:space:]]/, "", $2); print $2}' "$PKG_DIR/Makefile")
          TAG="${{ inputs.release_tag }}"

          # tag 与显示名称分离：
          #   tag  保持机器可读，正式版用固定 tag（v2.4.11-r13），重复构建时原地
          #        更新而不是每次新建，从源头上避免 Release 历史堆积；预发布才带
          #        运行号以便区分。
          #   name 用人类可读格式，不再直接把裸 tag 当标题显示。
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            NAME="luci-app-qmodem-generic v${VER}-r${REL} Nightly (build ${{ github.run_number }})"
            if [ -z "$TAG" ]; then
              TAG="v${VER}-r${REL}-nightly.${{ github.run_number }}"
            fi
          else
            NAME="luci-app-qmodem-generic v${VER}-r${REL}"
            if [ -z "$TAG" ]; then
              TAG="v${VER}-r${REL}"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

          {
            echo "## luci-app-qmodem-generic ${VER}-${REL}"
            echo
            if [ "${{ inputs.prerelease }}" = "true" ]; then
              echo '> **预发布版本（Nightly）**：仅供测试，生产环境请使用正式版。'
            else
              echo '> **正式版（Stable）**'
            fi
            echo
            echo "QModem 通用美化版 LuCI Web UI，适用于任意被 QModem 识别的模组。"
            echo
            echo "### 安装"
            echo '旧版 opkg 系统选择 IPK，新版 apk 系统选择 APK；两个格式均提供主包、翻译包和独立的离线 RUN。'
            echo 'iStore 手动安装请按系统选择 `*-ipk-offline.run` 或 `*-apk-offline.run`，安装时不访问软件源。'
            echo '设备需已安装 `luci-base`、`qmodem`、`jq` 与 `jsonfilter`；缺少依赖会直接提示。'
            echo
            echo '```sh'
            echo '# apk（ImmortalWrt 25.12 / 25.12-SNAPSHOT）'
            echo 'apk --no-network --repositories-file /dev/null add --allow-untrusted ./luci-app-qmodem-generic-*.apk'
            echo '# opkg（OpenWrt / ImmortalWrt / iStoreOS 23.05 / 24.10）'
            echo 'opkg install ./luci-app-qmodem-generic_*_all.ipk'
            echo '```'
            echo
            echo '> 运行时依赖 `qmodem`，请先安装 QModem。'
            echo '> 若此前装过 `luci-app-mt5700m`，请先卸载再安装本包。'
            echo
            echo '### 产物'
            echo '| 文件 | 大小 |'
            echo '| --- | --- |'
            for f in dist/*; do
              [ -f "$f" ] || continue
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
            done
          } > release-notes.md

          # 追加更新日志：提取 CHANGELOG.md 第一个版本段落（到下一个 ## 标题为止）
          {
            echo
            echo '---'
            echo
            if [ -f CHANGELOG.md ]; then
              awk '/^## \[/{n++; if (n == 2) exit} n == 1' CHANGELOG.md
            else
              echo '_（未找到 CHANGELOG.md）_'
            fi
          } >> release-notes.md
          cat release-notes.md

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body_path: release-notes.md
          prerelease: ${{ inputs.prerelease }}
          files: |
            dist/*.apk
            dist/*.ipk
            dist/*.run
          fail_on_unmatched_files: true

      # 每种格式都必须有主包和独立离线包，成功后才允许清理旧发布。
      - name: Verify published packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          release_json=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$CURRENT_TAG")
          for format in apk ipk; do
            main_count=$(echo "$release_json" | jq --arg ext "$format" '[.assets[].name | select(test("^luci-app-qmodem-generic[-_].*\\." + $ext + "$"))] | length')
            offline_count=$(echo "$release_json" | jq --arg ext "$format" '[.assets[].name | select(endswith("-" + $ext + "-offline.run"))] | length')
            if [ "$main_count" -lt 1 ] || [ "$offline_count" -lt 1 ]; then
              echo "::error::Release $CURRENT_TAG 缺少主 $format 或对应离线 RUN 附件，停止后续清理"
              exit 1
            fi
          done
          release_url=$(echo "$release_json" | jq -r '.html_url')
          echo "已校验 $CURRENT_TAG：APK / IPK 主包与离线包均已上传"
          echo "APK / IPK 已发布：[$CURRENT_TAG]($release_url)" >> "$GITHUB_STEP_SUMMARY"

      - name: Show release download
        run: |
          echo "APK / IPK 已发布：[打开 Releases 下载]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases)" >> "$GITHUB_STEP_SUMMARY"

      # 清理时必须先锁定本次 Release，不可靠 GitHub API 的返回顺序：
      # API 排序可能按 tag 的 created_at，导致新发布的 Nightly 被误删。
      - name: Clean up old releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_TAG: ${{ steps.meta.outputs.tag }}
          KEEP_INPUT: ${{ inputs.keep_releases }}
        run: |
          set -euo pipefail
          KEEP="$KEEP_INPUT"
          case "$KEEP" in
            ''|*[!0-9]*) echo "::warning::keep_releases 取值非法，跳过清理"; exit 0 ;;
          esac
          if [ "$KEEP" -lt 1 ]; then
            echo "::warning::至少保留本次 Release，已将保留数设为 1"
            KEEP=1
          fi

          # 确认本次发布的 tag 和 Release 实际存在；失败时绝不清理。
          CURRENT_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$CURRENT_TAG" --jq '.id')
          if [ -z "$CURRENT_ID" ] || [ "$CURRENT_ID" = "null" ]; then
            echo "::error::无法确认本次 Release，禁止执行清理"
            exit 1
          fi
          echo "保护本次发布：$CURRENT_TAG (id=$CURRENT_ID)，保留最近 $KEEP 个 Release"

          # 按实际发布时间排序，再将本次 Release 固定计入保留名额。
          # 先取得完整列表；API 调用失败时不得误删已有 Release。
          RELEASE_LIST=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq 'sort_by(.published_at // .created_at) | reverse | .[] | [.id, .tag_name] | @tsv')
          kept=1
          while IFS=$'\t' read -r id tag; do
            [ -n "$id" ] || continue
            if [ "$id" = "$CURRENT_ID" ]; then
              echo "保留本次发布：$tag"
              continue
            fi
            if [ "$kept" -lt "$KEEP" ]; then
              echo "保留历史发布：$tag"
              kept=$((kept + 1))
              continue
            fi
            echo "清理旧 Release：$tag (id=$id)"
            if gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" \
                || echo "::warning::已删除旧 Release，但删除 tag $tag 失败"
            else
              echo "::warning::删除旧 Release $tag 失败，保留对应 tag"
            fi
          done <<< "$RELEASE_LIST"
          echo "清理完成，本次 Release $CURRENT_TAG 已保留"
